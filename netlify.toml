# Netlify publica el diseñador CAD (index.html) en la raíz del sitio
# y la vitrina para jefatura en /visor.html (solo diseños ★ + bitácora de horas de public/vitrina.json).
#
# Nota: en Netlify el diseñador funciona completo (diseñar, exportar .3MF/.STL, guardar en el navegador),
# pero marcar ★ o editar horas de la vitrina solo se guarda con el servidor local (npm run dev),
# porque escribe public/vitrina.json.
[build]
  command = "npm run build:vitrina"
  publish = "dist"
