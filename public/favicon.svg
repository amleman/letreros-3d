<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>BiblioSign 3D</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Espesor de la placa (relieve 3D) -->
  <rect x="11" y="17" width="46" height="34" rx="7" fill="#9a3412"/>

  <!-- Cara frontal de la placa -->
  <rect x="7" y="13" width="46" height="34" rx="7" fill="url(#plate)"/>

  <!-- Franja Dewey -->
  <rect x="12" y="18" width="5" height="24" rx="2" fill="#1e3a5f"/>

  <!-- Lomos de libro en relieve (sombra + cara) -->
  <g fill="#7c2d12" opacity="0.55">
    <rect x="24" y="21" width="6" height="22" rx="1.5"/>
    <rect x="32" y="18" width="6" height="25" rx="1.5"/>
    <rect x="41.5" y="22.5" width="6" height="21" rx="1.5" transform="rotate(14 44.5 33)"/>
  </g>
  <g fill="#fffbeb">
    <rect x="22.5" y="19.5" width="6" height="22" rx="1.5"/>
    <rect x="30.5" y="16.5" width="6" height="25" rx="1.5"/>
    <rect x="40" y="21" width="6" height="21" rx="1.5" transform="rotate(14 43 31.5)"/>
  </g>
  <g fill="#f59e0b">
    <rect x="22.5" y="23" width="6" height="2"/>
    <rect x="30.5" y="20" width="6" height="2"/>
  </g>
</svg>
